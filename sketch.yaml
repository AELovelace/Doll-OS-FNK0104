default_profile: esp32s3
profiles:
  esp32s3:
    fqbn: esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,PSRAM=opi,USBMode=default,CDCOnBoot=cdc,UploadMode=cdc
    platforms:
      - platform: esp32:esp32 (3.3.10)
    libraries:
      # dir: entries need arduino-cli >= 1.1.0 (Arduino IDE >= 2.3.4); older
      # versions fail to parse them and refuse to open the whole sketch.
      - dir: libraries/TFT_eSPI
      # ESP32Ping and esp32ARP aren't in the Arduino Library Registry (hand-installed
      # from GitHub), so they can't be pinned by name/version like the two below --
      # reference the shared sketchbook install directly instead
      - dir: ../libraries/ESP32Ping
      - dir: ../libraries/esp32ARP
      - dir: ../libraries/ESP32-audioI2S
      # FNK0104B onboard RGB uses the ESP32 core RMT API with Freenove's tested
      # timing in Led.ino; the full Freenove object reserves 24KB for 256 pixels.
      - PubSubClient (2.8)
      - LibSSH-ESP32 (5.8.0)
      - ArduinoJson (7.4.2)
      # FtpServer.ino -- SD-card-over-network. NOTE: its storage backend is selected
      # in the library's own config header (FtpServerKey.h -> STORAGE_SD_MMC), which
      # is a hand edit that isn't captured by this version pin. See FtpServer.ino.
      - SimpleFTPServer (3.0.2)
